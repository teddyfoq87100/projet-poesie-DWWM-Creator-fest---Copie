<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Garden of Poetry</title>
    <!-- Lien vers votre feuille de style CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="home-page">
    <div class="main-container">
      <!-- Barre de navigation et gestion de la session -->
      <nav class="nav-links">
        <nav id="authNav">
          <!-- Affiché si le visiteur n'est PAS connecté -->
          <div id="guestLinks">
            <a href="login.html">Connexion</a>
            <a href="register.html">Inscription</a>
          </div>

          <!-- Affiché si le visiteur est CONNECTÉ -->
          <div id="userLinks" style="display: none">
            <span id="welcomeUser"></span>
            <button id="logoutBtn">Se déconnecter</button>
          </div>
        </nav>
      </nav>

      <!-- En-tête de la page -->
      <header>
        <h1>The Garden of Poetry</h1>
        <p>Bienvenue dans notre jardin littéraire.</p>
      </header>

      <!-- Formulaire pour ajouter un poème (affiché dynamiquement si connecté) -->
      <section class="add-poem-section" id="poemSection" style="display: none">
        <h3>Planter un nouveau poème</h3>
        <form id="poemForm">
          <input type="text" id="title" placeholder="Titre" required />
          <input type="text" id="author" placeholder="Auteur" required />
          <input type="text" id="theme" placeholder="Thème" required />
          <textarea
            id="content"
            placeholder="Votre poème..."
            required
          ></textarea>
          <button type="submit">Publier</button>
        </form>
        <p id="formMessage"></p>
      </section>

      <!-- Liste où les poèmes de la base de données vont s'afficher -->
      <section>
        <h2>Les Poèmes du Jardin</h2>
        <div id="poemsList">
          <p>Chargement des poèmes...</p>
        </div>
      </section>
    </div>

    <!-- Script JavaScript unique relié proprement depuis le dossier public -->
    <script src="script.js"></script>
  </body>
</html>
